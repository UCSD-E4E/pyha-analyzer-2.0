[project]
name = "pyha-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "audiomentations>=0.40.0",
    "datasets<4.0.0", 
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.6",
    "librosa>=0.10.2.post1",
    "pandas>=2.2.3",
    "pillow>=11.2.1",
    "pyrootutils>=1.0.4",
    "soundfile>=0.13.1",
    "timm>=1.0.15",
    "torchmetrics>=1.7.1",
    "transformers[torch]>=4.51.3",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]
cu128 = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]
cu126 = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]

cu130 = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]

wandb = [
  "wandb>=0.19.10",
]

[tool.uv]
package = true
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
    { extra = "cu126" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.setuptools.packages.find]
where = ["."]
include = ["pyha_analyzer*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


